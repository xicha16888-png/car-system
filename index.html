async function testConn(){
  var url=document.getElementById('sysUrl').value.trim().replace(/\/$/,'');
  var el=document.getElementById('connStatus');
  el.textContent='🔄 连接中...';
  try{
    var r=await fetch(url+'/api/test',{signal:AbortSignal.timeout(8000)});
    var d=await r.json();
    el.textContent=d.ok?'✅ '+d.message:'❌ '+d.message;
    el.style.color=d.ok?'#2e7d32':'#c62828';
  }catch(e){el.textContent='❌ '+e.message;el.style.color='#c62828';}
}

function log(msg,type){
  var logEl=document.getElementById('log');
  logEl.style.display='block';
  var d=document.createElement('div');
  if(type) d.className=type;
  d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
}

async function doImport(){
  var url=document.getElementById('sysUrl').value.trim().replace(/\/$/,'');
  if(!confirm('确认将 '+FINANCE_DATA.length+' 条实收记录导入系统？\n（会与现有记录合并，不删除原有数据）')) return;
  log('📡 读取系统现有数据...','info');
  var sysData;
  try{
    var r=await fetch(url+'/api/data'); sysData=await r.json();
  }catch(e){log('❌ 读取失败: '+e.message,'err');return;}
  var loans=sysData.car_loans||[];
  var finance=sysData.car_finance||[];
  log('系统现有合同: '+loans.length+'笔, 财务记录: '+finance.length+'条','info');
  
  // 关联合同ID
  var newRecs=FINANCE_DATA.map(function(r){
    var note=r.note||'';
    var namePart=note.split('·')[1]||'';
    var platePart=note.split('·')[2]||'';
    var loan=loans.find(function(l){return l.name===namePart.trim()&&l.plate===platePart.trim();});
    return Object.assign({},r,{loanId:loan?loan.id:''});
  });
  
  // 去重（同id不重复导入）
  var existIds=new Set(finance.map(function(f){return f.id;}));
  var toAdd=newRecs.filter(function(r){return !existIds.has(r.id);});
  log('待新增: '+toAdd.length+'条 (跳过重复: '+(newRecs.length-toAdd.length)+'条)','info');
  
  var allFinance=[...finance,...toAdd];
  log('保存中...','info');
  try{
    var saveR=await fetch(url+'/api/data',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({car_loans:loans,car_finance:allFinance})
    });
    if(saveR.ok){
      log('✅ 导入完成！共'+toAdd.length+'条实收记录已写入系统','');
      log('利息收入: $'+toAdd.filter(function(r){return r.category==="利息收入";}).reduce(function(s,r){return s+r.amount;},0).toFixed(0),'');
      log('本金回收: $'+toAdd.filter(function(r){return r.category==="本金回收";}).reduce(function(s,r){return s+r.amount;},0).toFixed(0),'');
    }else{log('❌ 保存失败','err');}
  }catch(e2){log('❌ '+e2.message,'err');}
}
