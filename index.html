// ══ 表单里任何会影响还款计划的字段变了，就按当前选的还款方式分流到对应计算器 ══
function onScheduleFieldChange() {
  var repay = document.getElementById("f_repay")?.value;
  toggleRateTermFields(repay);
  if(repay === REPAY_ACTUAL) renderActualTrackingUI(window._addFormLoan);
  else renderCustomScheduleUI(window._addFormLoan);
}
// "实收记账"不需要预设利率/期数（这两个数字是反算出来的，不是提前设的），
// 选中它就把这两个输入框置灰，避免业务员误填一个不会被用到的数字；切回其他
// 还款方式时自动恢复可编辑。
function toggleRateTermFields(repay) {
  var isActual = repay === REPAY_ACTUAL;
  var rateEl = document.getElementById('f_rate'), termEl = document.getElementById('f_term');
  var rateLbl = document.getElementById('f_rate_label'), termLbl = document.getElementById('f_term_label');
  if(rateEl) { rateEl.disabled = isActual; rateEl.style.opacity = isActual ? 0.5 : 1; }
  if(termEl) { termEl.disabled = isActual; termEl.style.opacity = isActual ? 0.5 : 1; }
  if(rateLbl) rateLbl.innerHTML = isActual
    ? '月利率（%）<span style="font-size:11px;color:var(--muted);font-weight:400">实收记账模式不需要，留空即可</span>'
    : '月利率（%）<span style="font-size:11px;color:var(--muted);font-weight:400">合同名义利率，仅供参考，不影响下面表格的计算</span>';
  if(termLbl) termLbl.innerHTML = isActual
    ? '贷款期限<span style="font-size:11px;color:var(--muted);font-weight:400">实收记账模式不需要，回款登记里可以一直往后加期</span>'
    : '贷款期限（期）<span style="font-size:11px;color:var(--muted);font-weight:400">客户续期就把这里改大，下面逐期表格会自动多出新的一期，已填的老期数不受影响</span>';
}

// ══ "自定义还款"计划编辑器：逐期到期日/本金/利息全部手填，互不联动 ══
// 场景：柬埔寨这边纸质合同签的时候，往往已经把每一期的到期日、应还本金、应还
// 利息都写死在合同表格里了（不是套统一公式现算出来的），业务员录系统就是照抄
// 这张表——所以这里三样都给独立输入框，不自动联动，业务员填的是合同上写的数字，
// 不是系统帮他算的数字。2026-09 起，先息后本/等额本息/永续贷这三种也用这张表：
// 区别只是"没有保存过真实数据时"的默认值——自定义还款默认空着让业务员自己填，
// 其他三种默认按公式（当前的利率/期数）算好一版参考值填进去，业务员可以直接用，
// 也可以逐期改成实际收到/约定的数字，改了之后系统就以改过的数字为准（见 calcRepay
// 里的 scheduleHasManualData 判断）。
function renderCustomScheduleUI(d) {
  var box = document.getElementById("calcPreviewBox"); if(!box) return;
  var amount = parseFloat(document.getElementById("f_amount")?.value)||0;
  var rate   = parseFloat(document.getElementById("f_rate")?.value)||0;
  var term   = parseInt(document.getElementById("f_term")?.value)||1;
  var repay  = document.getElementById("f_repay")?.value||"先息后本";
  var loanDate = document.getElementById("f_date")?.value || new Date().toISOString().slice(0,10);
  var actEl = document.getElementById("f_actual_amount");
  var hcEl  = document.getElementById("f_haircut");
  var haircut, actual;
  if(window._lastEdit === "actual" && actEl && actEl.value !== "" && amount > 0) {
    actual  = parseFloat(actEl.value) || 0;
    haircut = actual > 0 ? Math.round((1 - actual/amount)*10000)/100 : 0;
    if(hcEl) hcEl.value = haircut.toFixed(2);
  } else {
    haircut = parseFloat(hcEl?.value) || 0;
    actual  = Math.round(amount * (1 - haircut/100) * 100) / 100;
    if(actEl && amount > 0) actEl.value = actual || "";
  }
  if(!amount) { box.style.display="none"; return; }
  // 不管哪种还款方式，没有已保存的真实数据时一律留空——业务员自己逐期填，
  // 系统不代填任何数字（老板明确要求："我要业务员自己填，不要你系统填"）
  // 每期数据：优先用当前输入框里已经填了的值（改期数时不清空已填的），输入框还
  // 不存在时（刚切到这个还款方式或刚打开编辑页）用合同已保存的 d.customSchedule
  // 兜底（新旧两种格式都认：对象{principal,interest,dueDate} 或早期的纯数字本金），
  // 都没有保存过的话，留空，等业务员自己填
  var rows = [];
  for(var i=1;i<=term;i++) {
    var pEl = document.getElementById('cs_p_'+i), iEl = document.getElementById('cs_i_'+i), dEl = document.getElementById('cs_d_'+i);
    if(pEl || iEl || dEl) {
      rows.push({ principal: pEl?(parseFloat(pEl.value)||0):0, interest: iEl?(parseFloat(iEl.value)||0):0, dueDate: dEl?(dEl.value||""):"" });
    } else {
      var saved = d && d.customSchedule && d.customSchedule.length ? d.customSchedule[i-1] : null;
      if(saved && typeof saved === "object" && (saved.principal || saved.interest || saved.dueDate)) {
        rows.push({ principal: saved.principal||0, interest: saved.interest||0, dueDate: saved.dueDate||defaultDueDate(loanDate,i) });
      } else if(saved != null && typeof saved !== "object") {
        rows.push({ principal: saved, interest: 0, dueDate: defaultDueDate(loanDate,i) }); // 旧格式，利息留给业务员自己填/用批量按钮
      } else {
        rows.push({ principal: 0, interest: 0, dueDate: defaultDueDate(loanDate,i) });
      }
    }
  }
  var sumPrincipal = Math.round(rows.reduce(function(s,v){return s+v.principal;},0)*100)/100;
  var sumInterest  = Math.round(rows.reduce(function(s,v){return s+v.interest;},0)*100)/100;
  var diff = Math.round((amount - sumPrincipal)*100)/100;
  // 反算实际月利率/综合利息：拿这张表当前实际填的数字，跟保存之后走的是同一套
  // 计算（loanComprehensiveInterest等函数），保证"填的时候看到的"跟"保存后看到的"
  // 是同一个数字，不会出现预览和保存后对不上号的情况
  var tempLoan = { amount:amount, actualAmount:actual, haircut:haircut, rate:rate, term:term, repay:repay,
    customSchedule: rows.map(function(r){ return {principal:r.principal, interest:r.interest, dueDate:r.dueDate}; }) };
  var comprehensive = loanComprehensiveInterest(tempLoan);
  var comprehensivePct = loanComprehensiveInterestPct(tempLoan);
  var effMonthlyRate = loanEffectiveMonthlyRate(tempLoan);

  var rowsHtml = "";
  for(var i=1;i<=term;i++) {
    var rw = rows[i-1];
    rowsHtml += "<tr><td>第"+i+"期</td>"+
      "<td><input type=\"date\" id=\"cs_d_"+i+"\" value=\""+rw.dueDate+"\" style=\"padding:4px 6px;border:1px solid #cfd8dc;border-radius:4px;font-family:inherit\" oninput=\"updateCustomScheduleTotals()\"></td>"+
      "<td><input type=\"number\" id=\"cs_p_"+i+"\" value=\""+(rw.principal||"")+"\" min=\"0\" step=\"0.01\" placeholder=\"0\" style=\"width:100px;padding:4px 6px;border:1px solid #cfd8dc;border-radius:4px;font-family:inherit\" oninput=\"updateCustomScheduleTotals()\"></td>"+
      "<td><input type=\"number\" id=\"cs_i_"+i+"\" value=\""+(rw.interest||"")+"\" min=\"0\" step=\"0.01\" placeholder=\"0\" style=\"width:100px;padding:4px 6px;border:1px solid #cfd8dc;border-radius:4px;font-family:inherit\" oninput=\"updateCustomScheduleTotals()\"></td>"+
      "<td id=\"cs_total_"+i+"\" style=\"font-weight:600\">$"+(rw.principal+rw.interest).toFixed(2)+"</td>"+
      "<td><button type=\"button\" class=\"btn btn-sm btn-outline\" style=\"white-space:nowrap\" onclick=\"settleAtPeriod("+i+")\">✅本期结清</button></td></tr>";
  }
  var headerText = "📊 "+repay+"还款计划——逐期填到期日/本金/利息，业务员自己填，系统不代填，填多少算多少";
  var quickBtns = "<button type=\"button\" class=\"btn btn-sm btn-outline\" onclick=\"quickFillCustomInterest()\">⚡ 按月利率（"+rate+"%）批量填利息</button><button type=\"button\" class=\"btn btn-sm btn-outline\" onclick=\"quickFillCustomDates()\">📅 按放款日逐月重填到期日</button><button type=\"button\" class=\"btn btn-sm btn-outline\" onclick=\"addOneMorePeriod()\">➕ 客户续期，增加一期</button>";
  // ══ 提前还款覆盖期提示（2026-09 新增）══ 砍头/每期利息本质是"买下一个月的
  // 使用权"：最后一笔已经填了利息的那一期，覆盖到"这一期到期日+1个月"。客户只要
  // 在这个日期之前结清本金，就不用再多收利息；过了这个日期还没结清，才需要再收
  // 一期利息（金额业务员自己跟客户协商填，不自动算）。这里只是把这个日期算出来
  // 提示业务员，不会替业务员做决定。
  var coverageHint = "";
  var lastFilledIdx = -1;
  for(var ci=rows.length-1; ci>=0; ci--) { if(rows[ci].interest>0) { lastFilledIdx = ci; break; } }
  if(lastFilledIdx >= 0 && rows[lastFilledIdx].dueDate) {
    var coverEnd = defaultDueDate(rows[lastFilledIdx].dueDate, 1);
    var todayStr = new Date().toISOString().slice(0,10);
    var remainIfSettle = diff>0 ? diff : 0;
    if(todayStr <= coverEnd) {
      coverageHint = "<div style=\"grid-column:1/-1;background:#e8f5e9;border-radius:8px;padding:10px 12px;font-size:12px;color:#2e7d32\">💡 第"+(lastFilledIdx+1)+"期利息已经覆盖到 "+coverEnd+"，客户在这之前结清本金（$"+remainIfSettle.toFixed(2)+"）不用再加收利息——直接在这一行点「✅本期结清」即可。</div>";
    } else {
      coverageHint = "<div style=\"grid-column:1/-1;background:#fff3e0;border-radius:8px;padding:10px 12px;font-size:12px;color:#e65100\">⚠️ 第"+(lastFilledIdx+1)+"期利息覆盖到 "+coverEnd+"，已经过了这个日期，客户现在结清通常要再收一期利息——金额可以跟客户协商，先点「➕ 客户续期，增加一期」加一行，手动填利息，再在那一行点「✅本期结清」。</div>";
    }
  }
  box.style.display = "block";
  box.innerHTML =
    "<div style=\"font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px\">"+headerText+"</div>"+
    "<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px\">"+
    "<div style=\"background:#e3f2fd;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">实际放款</div><div style=\"font-size:18px;font-weight:700;color:#1565c0\">$"+actual.toFixed(2)+"</div></div>"+
    "<div style=\"background:#fff3e0;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">利息合计</div><div id=\"cs_intTile\" style=\"font-size:18px;font-weight:700;color:#f57c00\">$"+sumInterest.toFixed(2)+"</div></div>"+
    "<div id=\"cs_sumTile\" style=\"background:"+(diff===0?"#e8f5e9":"#ffebee")+";border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">本金合计（应=贷款金额）</div><div class=\"cs-sum-val\" style=\"font-size:15px;font-weight:700;color:"+(diff===0?"#2e7d32":"#c62828")+"\">$"+sumPrincipal.toFixed(2)+(diff!==0?"（差$"+diff.toFixed(2)+"）":"（已配平）")+"</div></div>"+
    "<div id=\"cs_rateTile\" style=\"grid-column:1/-1;background:#ffebee;border-radius:8px;padding:10px;text-align:center;border:1.5px solid #ef9a9a\"><div style=\"font-size:11px;color:#546e7a\">🧮 反算实际月利率（砍头+上面填的利息，按当前期数"+term+"期平摊）</div><div class=\"cs-rate-val\" style=\"font-size:18px;font-weight:700;color:#c62828\">"+effMonthlyRate+"%</div><div class=\"cs-comp-val\" style=\"font-size:10px;color:#546e7a\">综合利息 $"+comprehensive.toFixed(2)+"（占实放"+comprehensivePct+"%）——跟着上面表格实时变，填得越多越准</div></div>"+
    coverageHint+
    "</div>"+
    "<div class=\"btn-row\" style=\"margin-bottom:8px\">"+quickBtns+"</div>"+
    "<div style=\"overflow-x:auto\"><table style=\"width:100%;font-size:12px;border-collapse:collapse\"><thead><tr style=\"background:#f5f5f5\"><th style=\"padding:6px 8px;text-align:left\">期数</th><th style=\"padding:6px 8px;text-align:left\">到期日</th><th style=\"padding:6px 8px;text-align:left\">应还本金</th><th style=\"padding:6px 8px;text-align:left\">应还利息</th><th style=\"padding:6px 8px;text-align:left\">合计</th><th style=\"padding:6px 8px;text-align:left\">操作</th></tr></thead><tbody>"+
    rowsHtml + "</tbody></table></div>"+
    "<div style=\"font-size:11px;color:var(--muted);margin-top:8px\">💡 本金/利息合计不需要非要对平才能保存——客户还没还完、或者是分批补录的，都可以先保存，之后回到这里继续补填，或者在「回款登记」里逐期登记实际收款。合同还没结束、客户要继续续期的话，点上面「➕ 客户续期，增加一期」就会在表格最后多加一行，前面已经填的期数不会被清空。客户要是提前把本金还清了，点对应那一期的「✅本期结清」——本金会自动填进那一期，后面还没发生的期数会自动清空，不会多算利息。</div>";
}
// ══ "✅本期结清"：业务员点客户实际结清本金的那一期——本金自动填进这一期（=贷款
// 金额-前面几期已经填的本金），后面还没发生的期数自动清空（贷款期限也跟着改小），
// 这样"综合利息/实际月利率"就是按真实发生的期数算，不会被没发生的期数拖累或多算。
function settleAtPeriod(period) {
  var amount = parseFloat(document.getElementById("f_amount")?.value)||0;
  var sumEarlierPrincipal = 0;
  for(var i=1;i<period;i++) {
    var pEl = document.getElementById('cs_p_'+i);
    sumEarlierPrincipal += pEl ? (parseFloat(pEl.value)||0) : 0;
  }
  var remain = Math.round((amount - sumEarlierPrincipal)*100)/100;
  if(remain<0) remain = 0;
  var dueEl = document.getElementById('cs_d_'+period);
  if(!confirm("确定客户在第"+period+"期（"+(dueEl?dueEl.value:'')+"）结清本金 $"+remain.toFixed(2)+" 吗？\n\n确定后：本金会自动填入第"+period+"期，贷款期限会改成"+period+"期，后面还没发生的期数会被清空（已经登记过回款的期数不受影响，需要的话再点「➕客户续期」加回来）。")) return;
  var pEl = document.getElementById('cs_p_'+period);
  if(pEl) pEl.value = remain;
  var termEl = document.getElementById('f_term');
  if(termEl) termEl.value = period;
  onScheduleFieldChange();
}
// 客户续期：期数+1，重新渲染表格——之前已经填的每一期都会原样保留（渲染时优先
// 读当前输入框里的值），表格最后只会多出一行空的给业务员填这一期新的
function addOneMorePeriod() {
  var termEl = document.getElementById("f_term"); if(!termEl) return;
  termEl.value = (parseInt(termEl.value)||0) + 1;
  onScheduleFieldChange();
}
// 到期日默认值：放款日起，按第N期往后推N个月（只是给业务员一个起点，改成合同上写的真实日期即可）
function defaultDueDate(loanDate, period) {
  var dt = new Date(loanDate);
  if(isNaN(dt.getTime())) dt = new Date();
  dt.setMonth(dt.getMonth() + period);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function quickFillCustomInterest() {
  var amount = parseFloat(document.getElementById("f_amount")?.value)||0;
  var rate   = parseFloat(document.getElementById("f_rate")?.value)||0;
  var term   = parseInt(document.getElementById("f_term")?.value)||1;
  var flat = Math.round(amount*rate/100*100)/100;
  for(var i=1;i<=term;i++) { var el = document.getElementById('cs_i_'+i); if(el) el.value = flat; }
  updateCustomScheduleTotals();
}
function quickFillCustomDates() {
  var term = parseInt(document.getElementById("f_term")?.value)||1;
  var loanDate = document.getElementById("f_date")?.value || new Date().toISOString().slice(0,10);
  for(var i=1;i<=term;i++) { var el = document.getElementById('cs_d_'+i); if(el) el.value = defaultDueDate(loanDate, i); }
}
// 逐期输入框敲字时只更新数字，不重建整个表格（避免每敲一个字光标就跳走）
function updateCustomScheduleTotals() {
  var amount = parseFloat(document.getElementById("f_amount")?.value)||0;
  var rate   = parseFloat(document.getElementById("f_rate")?.value)||0;
  var term   = parseInt(document.getElementById("f_term")?.value)||1;
  var repay  = document.getElementById("f_repay")?.value||"先息后本";
  var haircut = parseFloat(document.getElementById("f_haircut")?.value)||0;
  var actual = parseFloat(document.getElementById("f_actual_amount")?.value)||0;
  var sumP = 0, sumI = 0;
  var rows = [];
  for(var i=1;i<=term;i++) {
    var pEl = document.getElementById('cs_p_'+i), iEl = document.getElementById('cs_i_'+i), dEl = document.getElementById('cs_d_'+i);
    var p = pEl ? (parseFloat(pEl.value)||0) : 0;
    var it = iEl ? (parseFloat(iEl.value)||0) : 0;
    sumP += p; sumI += it;
    rows.push({ principal:p, interest:it, dueDate: dEl?(dEl.value||""):"" });
    var totCell = document.getElementById('cs_total_'+i);
    if(totCell) totCell.textContent = "$"+(p+it).toFixed(2);
  }
  sumP = Math.round(sumP*100)/100;
  sumI = Math.round(sumI*100)/100;
  var diff = Math.round((amount - sumP)*100)/100;
  var intTile = document.getElementById('cs_intTile');
  if(intTile) intTile.textContent = "$"+sumI.toFixed(2);
  var sumTile = document.getElementById('cs_sumTile');
  if(sumTile) {
    sumTile.style.background = diff===0 ? "#e8f5e9" : "#ffebee";
    var valEl = sumTile.querySelector('.cs-sum-val');
    if(valEl) {
      valEl.style.color = diff===0 ? "#2e7d32" : "#c62828";
      valEl.textContent = "$"+sumP.toFixed(2)+(diff!==0?"（差$"+diff.toFixed(2)+"）":"（已配平）");
    }
  }
  // 🧮 反算实际月利率——跟表格上其他格子一样，敲一个字就跟着重算一次
  var rateTile = document.getElementById('cs_rateTile');
  if(rateTile) {
    var tempLoan = { amount:amount, actualAmount:actual, haircut:haircut, rate:rate, term:term, repay:repay, customSchedule:rows };
    var comprehensive = loanComprehensiveInterest(tempLoan);
    var comprehensivePct = loanComprehensiveInterestPct(tempLoan);
    var effMonthlyRate = loanEffectiveMonthlyRate(tempLoan);
    var rv = rateTile.querySelector('.cs-rate-val'), cv = rateTile.querySelector('.cs-comp-val');
    if(rv) rv.textContent = effMonthlyRate+"%";
    if(cv) cv.textContent = "综合利息 $"+comprehensive.toFixed(2)+"（占实放"+comprehensivePct+"%）——跟着上面表格实时变，填得越多越准";
  }
}

// 展示合同已保存的真实还款记录（导入/历史数据），与"理论计算器"区分开，
// 避免误把calcRepay()现算的等额本息公式当成真实还款金额
function renderActualSchedule(d) {
  var box = document.getElementById("calcPreviewBox"); if(!box) return;
  // 还款计划表这里也改成跟"综合利息/实际月利率"用同一套现算的 calcRepay 结果，
  // 不再单独读 d.schedule 这个缓存数组——避免出现"上面统计数字"和"下面明细表"
  // 对不上号的情况（之前就是因为一个用缓存、一个没用，才会互相矛盾）。
  var fresh = loanFreshInterestCalc(d);
  var rows = "";
  var sch = fresh.schedule || [];
  for(var i=0;i<sch.length;i++) {
    var s = sch[i];
    rows += "<tr><td>第"+s.period+"期</td><td>$"+Number(s.principal||0).toFixed(2)+"</td><td>$"+Number(s.interest||0).toFixed(2)+"</td><td style=\"font-weight:600\">$"+Number(s.total||0).toFixed(2)+"</td></tr>";
  }
  var haircutAmt = loanHaircutAmount(d);
  var comprehensive = loanComprehensiveInterest(d);
  var comprehensivePct = loanComprehensiveInterestPct(d);
  var effMonthlyRate = loanEffectiveMonthlyRate(d);
  box.style.display = "block";
  box.innerHTML =
    "<div style=\"font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px\">📋 还款计划（按合同当前保存的额度/利率/期数/方式现算）</div>" +
    "<div style=\"font-size:11px;color:var(--muted);margin-bottom:10px\">以下按该合同当前保存的金额/利率/期数/还款方式/砍头%重新计算，保证跟上面的统计数字对得上。若在上方修改这些字段，会实时重新计算。</div>" +
    "<div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px\">" +
    "<div style=\"background:#e3f2fd;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">实际放款</div><div style=\"font-size:18px;font-weight:700;color:#1565c0\">$"+Number(d.actualAmount||0).toFixed(2)+"</div></div>" +
    "<div style=\"background:#fff3e0;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">总利息（不含砍头）</div><div style=\"font-size:18px;font-weight:700;color:#f57c00\">$"+fresh.totalInterest.toFixed(2)+"</div></div>" +
    "<div style=\"background:#f3e5f5;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">砍头息</div><div style=\"font-size:18px;font-weight:700;color:#8e24aa\">$"+haircutAmt.toFixed(2)+"</div></div>" +
    "<div style=\"background:#ffebee;border-radius:8px;padding:10px;text-align:center;border:1.5px solid #ef9a9a\"><div style=\"font-size:11px;color:#546e7a\">🧮 实际月利率（砍头+总利息平摊到每月）</div><div style=\"font-size:18px;font-weight:700;color:#c62828\">"+effMonthlyRate+"%</div><div style=\"font-size:10px;color:#546e7a\">综合利息 $"+comprehensive.toFixed(2)+"（占实放"+comprehensivePct+"%）</div></div>" +
    "</div>" +
    "<div style=\"overflow-x:auto\"><table style=\"width:100%;font-size:12px;border-collapse:collapse\"><thead><tr style=\"background:#f5f5f5\"><th style=\"padding:6px 8px;text-align:left\">期数</th><th style=\"padding:6px 8px;text-align:left\">本金</th><th style=\"padding:6px 8px;text-align:left\">利息</th><th style=\"padding:6px 8px;text-align:left\">合计</th></tr></thead><tbody>" +
    rows + "</tbody></table></div>";
}

// ══ "实收记账"合同的表单预览区：没有计划表可以展示，因为压根没有预设计划——
// 展示的是目前为止真实登记过的"反算统计"（新增合同时还没有任何登记记录，
// 全是$0，提示保存后去"回款登记"页面开始逐笔登记）
function renderActualTrackingUI(d) {
  var box = document.getElementById("calcPreviewBox"); if(!box) return;
  var amount = parseFloat(document.getElementById("f_amount")?.value)||0;
  var actEl = document.getElementById("f_actual_amount");
  var hcEl  = document.getElementById("f_haircut");
  var haircut, actual;
  if(window._lastEdit === "actual" && actEl && actEl.value !== "" && amount > 0) {
    actual  = parseFloat(actEl.value) || 0;
    haircut = actual > 0 ? Math.round((1 - actual/amount)*10000)/100 : 0;
    if(hcEl) hcEl.value = haircut.toFixed(2);
  } else {
    haircut = parseFloat(hcEl?.value) || 0;
    actual  = Math.round(amount * (1 - haircut/100) * 100) / 100;
    if(actEl && amount > 0) actEl.value = actual || "";
  }
  box.style.display = "block";
  var haircutAmt = Math.round((amount-actual)*100)/100;

  if(!d || !d.id) {
    // 还没保存过，没有 loanId，自然也不会有回款记录——只能先预告砍头息，
    // 其余数字都要等保存之后、开始在"回款登记"里登记才会有
    box.innerHTML =
      "<div style=\"font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px\">💰 实收记账——不用填利率/期数，靠实际收款反算</div>"+
      "<div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px\">"+
      "<div style=\"background:#e3f2fd;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">实际放款</div><div style=\"font-size:18px;font-weight:700;color:#1565c0\">$"+actual.toFixed(2)+"</div></div>"+
      "<div style=\"background:#f3e5f5;border-radius:8px;padding:10px;text-align:center\"><div style=\"font-size:11px;color:#546e7a\">砍头息</div><div style=\"font-size:18px;font-weight:700;color:#8e24aa\">$"+haircutAmt.toFixed(2)+"</div></div>"+
      "</div>"+
      "<div style=\"font-size:12px;color:var(--muted)\">💡 先保存这份合同，之后每次客户还款，去「回款登记」页面把实际收到的本金/利息记一笔——记得越多，这里的"+
      "综合利息、实际月利率就会越准，不需要在这里预先猜一个利率/期数出来。</div>";
    return;
  }

  var stats = loanActualStats(d);
  var recs = _financeRecords.filter(function(r){ return r.loanId===d.id && (r.category==='利息收入'||r.category==='本金回收'||r.category==='滞纳金'); })
    .sort(function(a,b){ return (a.date||'').localeCompare(b.date||'') || ((a.period||0)-(b.period||0)); });

async function saveLoan() {
  var name = document.getElementById("f_name")?.value.trim();
  var phone = document.getElementById("f_phone")?.value.trim();
  var plate = document.getElementById("f_plate")?.value.trim();
  var amount = parseFloat(document.getElementById("f_amount")?.value);
  if(!name) { alert("请输入客户姓名"); return; }
  if(!phone) { alert("请输入手机号"); return; }
  if(!plate) { alert("请输入车牌号"); return; }
  if(!amount || amount<=0) { alert("请输入有效的贷款金额"); return; }
  var haircut = parseFloat(document.getElementById("f_haircut")?.value)||0;
  var repay = document.getElementById("f_repay")?.value||"先息后本";
  var rate = parseFloat(document.getElementById("f_rate")?.value)||0;
  var term = parseInt(document.getElementById("f_term")?.value)||3;
  // 除"实收记账"外，把逐期到期日/本金/利息输入框里的值原样存下来（customSchedule，
  // 每期一个{principal,interest,dueDate}对象）——不管当前选的是哪种还款方式，这都是
  // 业务员这张表里实际填的数字（可能是公式默认值原样保存，也可能是改过的），
  // 总利息/展示全部走 calcRepay 现算，不额外缓存
  var customSchedule = null;
  if(repay !== REPAY_ACTUAL) {
    customSchedule = [];
    for(var ci=1;ci<=term;ci++) {
      var cpEl = document.getElementById('cs_p_'+ci), ciEl = document.getElementById('cs_i_'+ci), cdEl = document.getElementById('cs_d_'+ci);
      customSchedule.push({
        principal: cpEl ? (parseFloat(cpEl.value)||0) : 0,
        interest: ciEl ? (parseFloat(ciEl.value)||0) : 0,
        dueDate: cdEl ? (cdEl.value||"") : ""
      });
    }
  }
  var res = calcRepay(amount, rate, term, repay, haircut, customSchedule);
  var actualAmountEl = document.getElementById("f_actual_amount");
  var actualAmount = parseFloat(actualAmountEl?.value)||res.actual;
  var data = {
    name:name, phone:phone, plate:plate,
    idcard:document.getElementById("f_idcard")?.value.trim()||"",
    agent:document.getElementById("f_agent")?.value.trim()||"",
    brand:document.getElementById("f_brand")?.value.trim()||"",
    color:document.getElementById("f_color")?.value.trim()||"",
    model:document.getElementById("f_model")?.value.trim()||"",
    estimate:parseFloat(document.getElementById("f_estimate")?.value)||0,
    amount:amount,
    actualAmount:actualAmount,
    haircut:haircut,
    rate:rate,
    term:term,
    repay:repay,
    customSchedule:customSchedule || [],
    monthly:res.monthly,
    totalRepay:res.totalRepay,
    totalInterest:res.totalInterest,
    schedule:res.schedule,
    status:document.getElementById("f_status")?.value||"pending",
    date:document.getElementById("f_date")?.value||new Date().toISOString().slice(0,10),
    note:document.getElementById("f_note")?.value.trim()||""
  };
  var editId = _editId;
  var newIdForAlert = null;
  await mutateData(function(freshLoans) {
    if(editId) {
      var found = false;
      for(var i=0;i<freshLoans.length;i++) { if(freshLoans[i].id===editId) { for(var k in data) freshLoans[i][k]=data[k]; found=true; break; } }
      if(!found) { data.id = editId; freshLoans.unshift(data); } // 极端情况：编辑期间这条记录被别人删了，按原ID补回去
    } else {
      data.id = genId(freshLoans);
      newIdForAlert = data.id;
      freshLoans.unshift(data);
    }
    return freshLoans;
  }, null);
  alert(editId ? "✅ 贷款信息已更新" : "✅ 新增贷款成功 编号："+newIdForAlert);
  _editId=null; nav("list");
}

function getMonthOptions() {
  var months={};
  loanRecords().forEach(function(l){if(l.date)months[l.date.slice(0,7)]=1;});
  var arr=Object.keys(months).sort().reverse();
  return arr.map(function(m){return '<option value="'+m+'">'+m+'</option>';}).join('');
}
// 经办人筛选下拉——不是固定账号列表，是从已经填过的合同里去重出现过的名字，
// 业务员手填的名字有出入（比如"小李"/"李经理"）不会自动合并，只是方便筛选
function getAgentOptions() {
  var agents={};
  loanRecords().forEach(function(l){ if(l.agent) agents[l.agent]=1; });
  var arr=Object.keys(agents).sort();
  return arr.map(function(a){return '<option value="'+a+'">'+a+'</option>';}).join('');

function setStatusFilter(val) {
  var el=document.getElementById('statusFilter'); if(!el) return;
  el.value = el.value===val ? '' : val;
  filterList(); updateStatCards();
}

function updateStatCards() {
  var sel=document.getElementById('statusFilter')?.value||'';
  ['active','overdue','pending','closed'].forEach(function(s){
    var el=document.getElementById('sc_'+s); if(!el) return;
    el.style.borderColor = sel===s ? 'var(--navy)' : 'transparent';
  });
}

// 2026-09 改版："已结清"的合同不再跟还没结清的混在一起显示——日常查询列表
// 默认只看还在走的合同（审核中/还款中/逾期），已结清的收进列表最下面一个单独的
// 折叠区，默认收起，点一下才展开看，不占日常查询的视线、也不会让统计数字
// （笔数/贷款合计/月息合计）被一堆已经结清、不再需要跟进的旧合同稀释。
// 如果在上面"状态"筛选里专门选"已结清"，就还是按老样子，把匹配的已结清合同直接
// 显示在主列表（这时候折叠区不出现，因为已经在专门看已结清的了）。
function filterList() {
  var mobile=window.innerWidth<=768;
  var q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  var s=document.getElementById('statusFilter')?.value||'';
  var m=document.getElementById('monthFilter')?.value||'';
  var rp=document.getElementById('repayFilter')?.value||'';
  var ag=document.getElementById('agentFilter')?.value||'';
  var base=loanRecords().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  if(q) base=base.filter(function(l){return (l.name||'').toLowerCase().indexOf(q)>=0||(l.phone||'').indexOf(q)>=0||(l.plate||'').toLowerCase().indexOf(q)>=0||(l.id||'').toLowerCase().indexOf(q)>=0||(l.agent||'').toLowerCase().indexOf(q)>=0;});
  if(m) base=base.filter(function(l){return l.date&&l.date.slice(0,7)===m;});
  if(rp) base=base.filter(function(l){return (l.repay||'等额本息')===rp;});
  if(ag) base=base.filter(function(l){return (l.agent||'')===ag;});

  var openList, closedList;
  if(s) {
    // 专门选了某个状态（哪怕就是选"已结清"）：按老样子精确匹配，不额外拆分
    openList = base.filter(function(l){return l.status===s;});
    closedList = [];
  } else {
    openList = base.filter(function(l){return l.status!=='closed';});
    closedList = base.filter(function(l){return l.status==='closed';});
  }

  var result=document.getElementById('listResult'); if(!result) return;
  if(openList.length===0 && closedList.length===0){result.innerHTML='<div style="text-align:center;padding:48px;color:var(--muted)">暂无匹配记录</div>';return;}

  // 总金额统计——只算还没结清的这部分，已结清的不掺进日常要跟进的数字里
  var totalAmt=openList.reduce(function(s,l){return s+l.amount;},0);
  var totalMon=openList.reduce(function(s,l){return s+(l.monthly||0);},0);
  var h='<div style="font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:16px;flex-wrap:wrap">'+
    '<span>共 <b>'+openList.length+'</b> 笔'+(s?'':'（不含已结清）')+'</span>'+
    '<span>贷款合计 <b style="color:#1565c0">$'+totalAmt.toLocaleString()+'</b></span>'+
    '<span>月利息合计 <b style="color:#2e7d32">$'+totalMon.toLocaleString()+'</b></span>'+
    '</div>';

  if(openList.length===0) {
    h += '<div style="text-align:center;padding:30px;color:var(--muted)">没有符合条件、还没结清的合同</div>';
  } else {
    h += renderLoanGroups(openList, mobile, '');
  }

  if(!s && closedList.length>0) {
    var closedAmt = closedList.reduce(function(s,l){return s+l.amount;},0);
    var isOpen = !!_closedSectionOpen;
    h += '<div onclick="toggleClosedSection()" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:18px 0 0;background:#78909c;border-radius:'+(isOpen?'8px 8px 0 0':'8px')+';color:#fff;cursor:pointer;user-select:none">';
    h += '<span style="font-weight:700;font-size:13px"><span id="closedSectionArrow">'+(isOpen?'▼':'▶')+'</span> 📁 已结清合同（'+closedList.length+'笔）</span>';
    h += '<span style="font-size:12px;opacity:.85">贷款合计 $'+closedAmt.toLocaleString()+'</span></div>';
    h += '<div id="closedSectionBody" style="display:'+(isOpen?'':'none')+';margin-bottom:10px">'+renderLoanGroups(closedList, mobile, 'c_')+'</div>';
  }

  result.innerHTML = h;
}
function toggleClosedSection() {
  _closedSectionOpen = !_closedSectionOpen;
  var body = document.getElementById('closedSectionBody');
  var arrow = document.getElementById('closedSectionArrow');
  if(body) body.style.display = _closedSectionOpen ? '' : 'none';
  if(arrow) arrow.textContent = _closedSectionOpen ? '▼' : '▶';
}

async function saveAcquired() {
  var plate = document.getElementById("a_plate")?.value.trim();
  var amount = parseFloat(document.getElementById("a_amount")?.value);
  if(!plate) { alert("请输入车牌号"); return; }
  if(!amount || amount<=0) { alert("请输入有效的采购成本"); return; }
  var data = {
    assetType:"acquired",
    name: document.getElementById("a_name")?.value.trim()||"",
    phone: document.getElementById("a_phone")?.value.trim()||"",
    plate: plate,
    brand: document.getElementById("a_brand")?.value.trim()||"",
    model: document.getElementById("a_model")?.value.trim()||"",
    color: document.getElementById("a_color")?.value.trim()||"",
    amount: amount,
    actualAmount: amount,
    date: document.getElementById("a_date")?.value||new Date().toISOString().slice(0,10),
    note: document.getElementById("a_note")?.value.trim()||""
  };
  var editAcquiredId = _editAcquiredId;
  var newIdForAlert = null;
  await mutateData(function(freshLoans) {
    if(editAcquiredId) {
      var found = false;
      for(var i=0;i<freshLoans.length;i++) { if(freshLoans[i].id===editAcquiredId) { for(var k in data) freshLoans[i][k]=data[k]; found=true; break; } }
      if(!found) { data.id = editAcquiredId; data.status = data.status || "in_stock"; freshLoans.unshift(data); }
    } else {
      data.id = genAcquiredId(freshLoans);
      data.status = "in_stock";
      newIdForAlert = data.id;
      freshLoans.unshift(data);
    }
    return freshLoans;
  }, null);
  alert(editAcquiredId ? "✅ 收购车辆信息已更新" : "✅ 新增收购车辆成功 编号："+newIdForAlert);
  _editAcquiredId=null; nav("acquired_list");
}

async function confirmSell(id) {
  var a = _loans.find(function(l){ return l.id===id; });
  if(!a) return;
  var saleAmount = parseFloat(document.getElementById("s_amount")?.value);
  if(!saleAmount || saleAmount<=0) { alert("请输入有效的成交价"); return; }
  var extraCost = parseFloat(document.getElementById("s_extra")?.value)||0;
  var saleDate = document.getElementById("s_date")?.value||new Date().toISOString().slice(0,10);
  var note = document.getElementById("s_note")?.value.trim()||"";
  var profit = 0;
  // 注意：状态变更（status/saleAmount等）要打在"最新拉下来的那份数组里的那条记录"上，
  // 不能打在页面打开时缓存的 a 上——a 可能是过时的（见 mutateData 的说明）
  await mutateData(function(freshLoans) {
    var fa = freshLoans.find(function(l){ return l.id===id; });
    if(!fa) return freshLoans; // 理论上不会发生：记录在此期间被删了
    fa.status = "sold";
    fa.saleAmount = saleAmount;
    fa.extraCost = extraCost;
    fa.saleDate = saleDate;
    profit = saleAmount - (fa.amount||0) - extraCost;
    return freshLoans;
  }, function(freshFinance) {
    // 售出后自动生成一笔"其他收入"财务记录，自动计入净利润（未售出前不产生任何利润）
    freshFinance = freshFinance.filter(function(r){ return !(r.loanId===id && r.category==='收购车辆销售利润'); });
    freshFinance.unshift({
      id: "F"+Date.now(),
      type: "income",
      amount: profit,
      category: "收购车辆销售利润",
      date: saleDate,
      loanId: id,
      note: "收购车辆售出："+(a.brand||'')+' '+(a.plate||'')+"，成交价"+formatMoney(saleAmount)+(extraCost?"，额外支出"+formatMoney(extraCost):"")+(note?"。"+note:"")
    });
    return freshFinance;
  });
  alert("✅ 已标记售出，利润 "+formatMoney(profit)+" 已自动计入净利润");
  nav("acquired_list");
}

// ══ 回款登记（业务员日常登记客户还款，覆盖三种还款方式，所有合同通用）══
// 跟"财务管理"里老板专用的"其他收入登记"是两码事：那个是给老板记跟合同无关的杂项
// 收支的；这个是业务员每天要用的——客户这个月还钱了，选合同+选第几期，系统按
// loanFreshInterestCalc()（跟"实际月利率"用的是同一套现算引擎，保证口径一致）
// 现算出这一期该收多少本金、多少利息，业务员确认/微调金额后保存。
// 保存时故意拆成两条独立的财务记录（利息收入 / 本金回收），而不是揉成一条——
// 因为利润表算净利润时，本金回收是要被剔除的（本金不是利润，是把本来就是自己的
// 钱收回来），如果混在一条记录里就没法正确区分，会把本金也算成利润。
function loanRemainingPrincipal(loan) {
  var recovered = _financeRecords.filter(function(r){ return r.loanId===loan.id && r.category==='本金回收'; }).reduce(function(s,r){ return s+(r.amount||0); }, 0);
  return Math.max(0, Math.round(((loan.amount||0) - recovered)*100)/100);
}
function loanRecordedPeriods(loanId) {
  return _financeRecords.filter(function(r){ return r.loanId===loanId && r.period; }).map(function(r){ return r.period; });
}
function nextUnrecordedPeriod(loanId) {
  var periods = loanRecordedPeriods(loanId);
  if(!periods.length) return 1;
  return Math.max.apply(null, periods) + 1;
}
// 按合同当前条件重新算出的还款计划表，取第N期该收的本金/利息/合计；
// 如果客户还在继续还（比如永续贷早就超过了当初录的期数），超出计划表的部分按
// 当前月利率估算一笔纯利息（永续贷本来就是"只要不结清，一直收利息"的产品）。
function repayPrefill(loan, period) {
  // "实收记账"没有公式、没有计划表，压根不预填——业务员这次实际收了多少，就填多少，
  // 不给一个"猜出来"的数字避免误导。
  if(loan.repay === REPAY_ACTUAL) return { principal: 0, interest: 0, total: 0 };
  var calc = loanFreshInterestCalc(loan);
  var entry = calc.schedule[period-1];
  if(entry) return { principal: entry.principal||0, interest: entry.interest||0, total: entry.total||0 };
  var interest = Math.round((loan.amount||0) * (loan.rate||0)/100 * 100)/100;
  return { principal: 0, interest: interest, total: interest };
}

// ══ 提前还款覆盖期提示（跟 renderCustomScheduleUI 里那个是同一个道理，这里用的
// 是已经真实登记过的回款期数，不是编辑表格里还没保存的草稿）══ 找到"已经登记过
// 回款的最后一期"，按合同当前条件算出那一期的到期日，覆盖到"到期日+1个月"——
// 今天在这之前，结清本金不用加收利息；今天超过了，提示业务员通常要再收一期。
function loanCoverageHint(loan) {
  if(!loan || loan.repay === REPAY_ACTUAL) return null;
  var recorded = loanRecordedPeriods(loan.id);
  if(!recorded.length) return null;
  var lastP = Math.max.apply(null, recorded);
  var calc = loanFreshInterestCalc(loan);
  var entry = calc.schedule[lastP-1];
  if(!entry || !entry.dueDate) return null;
  var coverEnd = defaultDueDate(entry.dueDate, 1);
  var today = new Date().toISOString().slice(0,10);
  return { lastP: lastP, coverEnd: coverEnd, within: today <= coverEnd };
}
function coverageHintHtml(hint) {
  if(!hint) return '';
  return hint.within
    ? '<div style="margin-top:8px;background:#e8f5e9;border-radius:8px;padding:8px 12px;font-size:12px;color:#2e7d32">💡 第'+hint.lastP+'期利息覆盖到 '+hint.coverEnd+'，客户在这之前结清本金不用再收利息</div>'
    : '<div style="margin-top:8px;background:#fff3e0;border-radius:8px;padding:8px 12px;font-size:12px;color:#e65100">⚠️ 第'+hint.lastP+'期利息覆盖到 '+hint.coverEnd+'，已经过期，现在结清通常要再收一期利息——金额可以跟客户协商，手动改下面的"本期利息"</div>';
}

function onRepayLoanSelect() {
  var id = document.getElementById('rc_loanId')?.value||'';
  var loan = _loans.find(function(l){ return l.id===id; });
  var infoEl = document.getElementById('rc_loanInfo');
  var formArea = document.getElementById('rc_formArea');
  var historyCard = document.getElementById('rc_historyCard');
  if(!loan) {
    if(infoEl) infoEl.innerHTML='';
    if(formArea) formArea.style.display='none';
    if(historyCard) historyCard.style.display='none';
    return;
  }
  var remain = loanRemainingPrincipal(loan);
  var isActual = loan.repay === REPAY_ACTUAL;
  infoEl.innerHTML =
    '<div style="background:#e3f2fd;border-radius:8px;padding:10px 14px;font-size:12px;display:flex;gap:20px;flex-wrap:wrap">'+
    '<span>👤 <b>'+loan.name+'</b></span>'+
    '<span>🚗 '+loan.plate+(loan.brand?' · '+loan.brand:'')+'</span>'+
    '<span>💰 贷款 <b style="color:#1565c0">$'+(loan.amount||0).toLocaleString()+'</b></span>'+
    '<span>📋 '+(loan.repay||'等额本息')+(isActual?'':' · 共'+(loan.term||1)+'期')+'</span>'+
    (isActual?'':'<span>🧮 月利率 '+(loan.rate||0)+'%</span>')+
    '<span>剩余本金 <b style="color:#e65100">$'+remain.toLocaleString()+'</b></span>'+
    '</div>' + coverageHintHtml(loanCoverageHint(loan));

  var sel = document.getElementById('rc_period');
  var nextP = nextUnrecordedPeriod(id);
  var recorded = loanRecordedPeriods(id);
  var maxP = Math.max(loan.term||1, nextP+2);
  var calc = loanFreshInterestCalc(loan);
  var today = new Date().toISOString().slice(0,10);
  var opts='';
  for(var i=1;i<=maxP;i++) {
    var already = recorded.indexOf(i) >= 0;
    var due = calc.schedule[i-1] ? (calc.schedule[i-1].dueDate||'') : '';
    var overdue = due && due < today && !already;
    var label = '第'+i+'期'+(due?'（应还'+due+'）':'')+(already?' ✅已登记':(overdue?' ⚠️已逾期':''));
    opts += '<option value="'+i+'"'+(i===nextP?' selected':'')+'>'+label+'</option>';
  }
  sel.innerHTML = opts;
  document.getElementById('rc_settle').checked = false;
  formArea.style.display='block';
  onRepayPeriodChange();
  renderRepayHistory(id);
}

function onRepayPeriodChange() {
  var loanId = document.getElementById('rc_loanId')?.value||'';
  var loan = _loans.find(function(l){ return l.id===loanId; });
  if(!loan) return;
  var period = parseInt(document.getElementById('rc_period')?.value)||1;
  var pf = repayPrefill(loan, period);
  document.getElementById('rc_interest').value = pf.interest;
  document.getElementById('rc_principal').value = pf.principal;
  document.getElementById('rc_settle').checked = false;
}

function onRepaySettleToggle() {
  var loanId = document.getElementById('rc_loanId')?.value||'';
  var loan = _loans.find(function(l){ return l.id===loanId; });
  if(!loan) return;
  var checked = document.getElementById('rc_settle').checked;
  if(checked) {
    document.getElementById('rc_principal').value = loanRemainingPrincipal(loan);
    // 上一期利息已经覆盖到今天之前的话，提前结清不用再收利息，自动把利息栏清零
    // （业务员看到提示自己判断，这里只是省一步手动清零，不会覆盖过期的情况）
    var hint = loanCoverageHint(loan);
    if(hint && hint.within) document.getElementById('rc_interest').value = 0;
  }
  else onRepayPeriodChange();
}

function renderRepayHistory(loanId) {
  var card = document.getElementById('rc_historyCard');
  var body = document.getElementById('rc_historyBody');
  var records = _financeRecords.filter(function(r){ return r.loanId===loanId && (r.category==='利息收入'||r.category==='本金回收'||r.category==='滞纳金'); });
  records.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || ((b.period||0)-(a.period||0)); });
  if(!records.length) { card.style.display='none'; return; }
  card.style.display='block';
  var h='<div class="table-wrap"><table><thead><tr><th>期数</th><th>日期</th><th>分类</th><th>金额</th><th>备注</th><th>操作</th></tr></thead><tbody>';
  records.forEach(function(r){
    h+='<tr><td>'+(r.period?'第'+r.period+'期':'—')+'</td><td>'+formatDate(r.date)+'</td><td>'+r.category+'</td>';
    h+='<td style="font-weight:600;color:#2e7d32">'+formatMoney(r.amount)+'</td>';
    h+='<td style="color:var(--muted);font-size:12px">'+(r.note||'')+'</td>';
    h+='<td>'+(canDelete()?'<button class="btn btn-sm btn-danger" onclick="deleteFinanceRecord(\''+r.id+'\')">删除</button>':'<span style="color:var(--muted);font-size:12px">—</span>')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  body.innerHTML = h;
}

async function saveRepayCollect() {
  if(!canWriteLoans()) { alert("⛔ 你的账号没有登记回款的权限"); return; }
  var loanId = document.getElementById('rc_loanId')?.value||'';
  var loan = _loans.find(function(l){ return l.id===loanId; });
  if(!loan) { alert("请先选择合同"); return; }
  var period = parseInt(document.getElementById('rc_period')?.value)||1;
  var date = document.getElementById('rc_date')?.value||new Date().toISOString().slice(0,10);
  var interest = parseFloat(document.getElementById('rc_interest')?.value)||0;
  var principal = parseFloat(document.getElementById('rc_principal')?.value)||0;
  var latefee = parseFloat(document.getElementById('rc_latefee')?.value)||0;
  var note = document.getElementById('rc_note')?.value.trim()||"";
  if(interest<=0 && principal<=0 && latefee<=0) { alert("请至少填写利息/本金/滞纳金其中一项金额"); return; }

  var stamp = Date.now();
  var newRecs = [];
  if(interest>0) newRecs.push({ id:"F"+stamp+"1", type:"income", amount:interest, category:"利息收入", date:date, loanId:loanId, period:period, note:note });
  if(principal>0) newRecs.push({ id:"F"+stamp+"2", type:"income", amount:principal, category:"本金回收", date:date, loanId:loanId, period:period, note:note });
  if(latefee>0) newRecs.push({ id:"F"+stamp+"3", type:"income", amount:latefee, category:"滞纳金", date:date, loanId:loanId, period:period, note:note });
  var financeResult = await mutateData(null, function(freshFinance) {
    newRecs.forEach(function(r){ freshFinance.unshift(r); });
    return freshFinance;
  });
  if(!financeResult.ok) { alert("⚠️ 回款保存失败，请检查网络后重试"); return; }

  // mutateData 保存成功后，_financeRecords 已经同步为"最新数据+刚登记的这几条"，
  // 这里算剩余本金用的是这份最新数据，不会因为本地过时而算错
  var remain = loanRemainingPrincipal(loan);
  var closedNow = false;
  if(remain<=0 && loan.status!=='closed') {
    if(confirm("该合同本金已全部收回（剩余$0），是否标记合同为「已结清」？")) {
      await mutateData(function(freshLoans) {
        var fl = freshLoans.find(function(l){ return l.id===loanId; });
        if(fl) fl.status = 'closed';
        return freshLoans;
      }, null);
      closedNow = true;
    }
  }
  alert("✅ 第"+period+"期回款已登记"+(closedNow?"，合同已标记为已结清":""));
  renderRepayCollect();
  var reselect = document.getElementById('rc_loanId');
  if(reselect && !closedNow) { reselect.value = loanId; onRepayLoanSelect(); }
}

async function saveFinanceRecord(type) {
  if(!canAddFinance()) { alert("⛔ 你的账号没有新增收支记录的权限"); return; }
  var amount = parseFloat(document.getElementById("fi_amount")?.value);
  if(!amount || amount<=0) { alert("请输入有效的金额"); return; }
  var rec = {
    id: "F"+Date.now(),
    type: type,
    amount: amount,
    category: document.getElementById("fi_category")?.value||"其他",
    date: document.getElementById("fi_date")?.value||new Date().toISOString().slice(0,10),
    loanId: document.getElementById("fi_loanId")?.value.trim()||"",
    note: document.getElementById("fi_note")?.value.trim()||""
  };
  await mutateData(null, function(freshFinance) {
    freshFinance.unshift(rec);
    return freshFinance;
  });
  alert("✅ "+(type==="income"?"收入":"支出")+"记录已保存");
  renderFinanceForm(type);
}

async function deleteFinanceRecord(id) {
  if(!canDelete()) { alert("⛔ 只有老板账号能删除"); return; }
  if(!requireDeletePassword("删除这条财务记录")) return;
  await mutateData(null, function(freshFinance) {
    return freshFinance.filter(function(r){ return r.id!==id; });
  });
  renderFinanceForm(_financeRecords.length>0 ? _financeRecords[0].type : "income");
}

function renderFinancePnL() {
  var selMonth = document.getElementById('pnlMonth') ? document.getElementById('pnlMonth').value : '';
  var now = new Date();
  if(!selMonth) selMonth = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'));
  function inMonth(d,ym){ return d&&String(d).slice(0,7)===ym; }

  var _lr = loanRecords();
  var activeLoans  = _lr.filter(function(l){return l.status==='active';});
  var overdueLoans = _lr.filter(function(l){return l.status==='overdue';});
  var closedLoans  = _lr.filter(function(l){return l.status==='closed';});
  var pendingLoans = _lr.filter(function(l){return l.status==='pending';});
  var inBetLoans   = _lr.filter(function(l){return l.status==='active'||l.status==='overdue';});

  var totalPrincipal = inBetLoans.reduce(function(s,l){return s+l.amount;},0);
  var monthNewLoans  = _lr.filter(function(l){return inMonth(l.date,selMonth);});
  var monthNewAmount = monthNewLoans.reduce(function(s,l){return s+l.amount;},0);
  var monthNewActual = monthNewLoans.reduce(function(s,l){return s+(l.actualAmount||l.amount*(1-(l.haircut||9.5)/100));},0);
  // 砍头息 = 贷款金额 - 实际放款（精确计算，不用默认9.5%）
  var monthHaircut = monthNewLoans.reduce(function(s,l){
    var hc = l.actualAmount && l.amount > 0
      ? (l.amount - l.actualAmount)   // 精确：合同金额 - 实际放款
      : l.amount*(l.haircut||0)/100;  // 备用：用haircut字段
    return s + (hc > 0 ? hc : 0);
  },0);
  // ══ 按月应收/实收数据（从Excel表格提取）══
  var _MONTHLY_DATA = {"2026-03": {"due_int": 414, "recv_int": 414, "due_prin": 4200, "recv_prin": 4200}, "2026-04": {"due_int": 5174, "recv_int": 5174, "due_prin": 62360, "recv_prin": 58360}, "2026-05": {"due_int": 13750, "recv_int": 13253, "due_prin": 147200, "recv_prin": 135300}, "2026-06": {"due_int": 14022, "recv_int": 9016, "due_prin": 73694, "recv_prin": 47134}, "2026-07": {"due_int": 17460, "recv_int": 1000, "due_prin": 47452, "recv_prin": 5500}, "2026-08": {"due_int": 15912, "recv_int": 0, "due_prin": 39772, "recv_prin": 0}, "2026-09": {"due_int": 14227, "recv_int": 0, "due_prin": 84428, "recv_prin": 0}, "2026-10": {"due_int": 7803, "recv_int": 0, "due_prin": 1833, "recv_prin": 0}, "2026-11": {"due_int": 5843, "recv_int": 0, "due_prin": 833, "recv_prin": 0}, "2026-12": {"due_int": 3305, "recv_int": 0, "due_prin": 4133, "recv_prin": 0}};
  var _md = _MONTHLY_DATA[selMonth] || null;
  var monthIntDue   = _md ? _md.due_int   : inBetLoans.reduce(function(s,l){return s+l.amount*(l.rate||0)/100;},0);
  var monthPrinDue  = _md ? _md.due_prin  : 0;
  var monthPrinRecv_excel = _md ? _md.recv_prin : 0;
  var monthIntRecv_excel  = _md ? _md.recv_int  : 0;
  var monthDueRecords = _md ? [_md] : [];
  var _hasExcelData = !!_md;
  var recInc  = _financeRecords.filter(function(r){return r.type==='income' && inMonth(r.date,selMonth);});
  var recExp  = _financeRecords.filter(function(r){return r.type==='expense'&& inMonth(r.date,selMonth);});
  // 利息收入（不含本金回收）
  var manIntInc   = recInc.filter(function(r){return r.category!=='本金回收';}).reduce(function(s,r){return s+r.amount;},0);
  var manPrinRecov= recInc.filter(function(r){return r.category==='本金回收';}).reduce(function(s,r){return s+r.amount;},0);
  var manInc = manIntInc; // 利润只计利息相关收入，本金回收不算
  var manExp  = recExp.reduce(function(s,r){return s+r.amount;},0);
  // 实收利息：优先Excel数据，其次收入登记
  var monthIntRecv_login  = recInc.filter(function(r){return r.category==='利息收入';}).reduce(function(s,r){return s+r.amount;},0);
  var monthPrinRecv_login = manPrinRecov;
  var monthIntRecv  = _hasExcelData ? monthIntRecv_excel  : monthIntRecv_login;

  var incByCat={}, expByCat={};

  recExp.forEach(function(r){expByCat[r.category]=(expByCat[r.category]||0)+r.amount;});
  var netProfit = monthHaircut + manInc - manExp; // 砍头息+利息收入-支出（不含本金回收）

function renderCashFlow() {

// ══ 数据体检：自动扫合同，揪出"还款方式/利率跟实际不符"的疑似问题合同（老板专用）══
// 起因：Huo Sivmei 这份合同利率录成了0（批量导入时利率没解析成功，套用了默认值），
// 导致系统按公式算出来的利息/实际月利率全是错的——这个检查就是把这一类问题揪出来，
// 不用再靠肉眼一份份合同去对。两类检查规则：
//   A) 利率=0：贷款金额>0但利率是0，大概率是批量导入/手工录入时漏填了利率
//      （正常放贷业务不会真的0%利息），系统会把它当"免息"处理，利息/综合利息全错。
//   B) 实收利息跟公式对不上：这份合同已经有"回款登记"/财务记录里的利息收入流水了，
//      拿真实收到的利息金额，跟"还款方式"公式现算出来的利息比一比——如果差太多，
//      说明当初选的还款方式（先息后本/等额本息/永续贷）跟客户真实的还款安排不一致，
//      很可能是 Huo Sivmei 这种该用"自定义还款"记录的客户，只是被套进了标准公式。
function renderDataCheck() {
  var loans = loanRecords(); // 不含收购车辆
  var groupA = [], groupB = [];

  loans.forEach(function(l){
    var rate = l.rate||0, amount = l.amount||0, repay = l.repay||'先息后本';
    // 2026-09 起先息后本/等额本息/永续贷也能逐期填真实数据——已经填过真实数据的
    // 合同，利率是不是0已经无所谓了（反正不套公式），不算漏填
    if(amount>0 && rate<=0 && repay!=='自定义还款' && repay!==REPAY_ACTUAL && !scheduleHasManualData(l.customSchedule)) {
      groupA.push(l);
    }
    // 这三种情况本来就不是"纯套公式"，不参与B类比对：自定义还款、实收记账、
    // 或者虽然是先息后本/等额本息/永续贷但已经被业务员逐期填过真实数据了
    if(repay==='自定义还款' || repay===REPAY_ACTUAL || scheduleHasManualData(l.customSchedule)) return;

    var recs = _financeRecords.filter(function(r){ return r.loanId===l.id && r.category==='利息收入'; });
    if(recs.length < 2) return;
    recs = recs.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    var amounts = recs.map(function(r){ return r.amount||0; });
    var avgActual = amounts.reduce(function(s,v){return s+v;},0)/amounts.length;
    var spreadActualPct = avgActual ? (Math.max.apply(null,amounts)-Math.min.apply(null,amounts))/avgActual*100 : 0;

    var calc = loanFreshInterestCalc(l);
    var formulaInts = calc.schedule.map(function(s){ return s.interest; });
    var avgFormula = formulaInts.length ? formulaInts.reduce(function(s,v){return s+v;},0)/formulaInts.length : 0;
    var spreadFormulaPct = avgFormula ? (Math.max.apply(null,formulaInts)-Math.min.apply(null,formulaInts))/avgFormula*100 : 0;

    var reasons = [];
    if(repay==='等额本息' && spreadActualPct<5 && spreadFormulaPct>15) {
      reasons.push('实收利息几乎不变（浮动'+spreadActualPct.toFixed(1)+'%），但"等额本息"公式该逐期递减（公式浮动'+spreadFormulaPct.toFixed(1)+'%）——像是固定利息客户，公式套错了');
    }
    if((repay==='先息后本'||repay==='永续贷') && spreadActualPct>20) {
      reasons.push('"'+repay+'"公式假设每期利息固定，但实收利息波动'+spreadActualPct.toFixed(1)+'%——利率/期数可能设置有误，或者本来就该用"自定义还款"');
    }
    if(avgFormula>0 && Math.abs(avgActual-avgFormula) > Math.max(avgFormula*0.15,5)) {
      reasons.push('实收利息均值$'+avgActual.toFixed(2)+' 跟公式算出的月息$'+avgFormula.toFixed(2)+' 差距较大');
    }
    if(reasons.length) groupB.push({ loan:l, amounts:amounts, formulaInts:formulaInts, reasons:reasons });
  });

  var h = '<div class="page-header"><div class="page-title">🔍 数据体检</div><div class="page-sub">自动核对每份合同的"利率/还款方式"跟实际情况是否一致，揪出像 Huo Sivmei 那种被套错公式的合同</div></div>';

  h += '<div class="card" style="background:'+(groupA.length?'#fff8e1':'#e8f5e9')+'"><div class="card-header"><div class="card-title">'+(groupA.length?'🔴':'✅')+' 利率为0的合同（共 '+groupA.length+' 笔）</div></div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">贷款金额>0但利率是0，大概率是录入/批量导入时利率没填上，系统会把它当免息处理，利息、综合利息、实际月利率全部会是错的（$0 / 0%）。</div>';
  if(groupA.length===0) { h += '<div style="text-align:center;padding:16px;color:var(--muted)">没有发现利率为0的合同 🎉</div>'; }
  else {
    h += '<div class="table-wrap"><table><thead><tr><th>编号</th><th>客户</th><th>贷款金额</th><th>还款方式</th><th>期数</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    groupA.forEach(function(l){
      h += '<tr><td style="font-weight:600">'+l.id+'</td><td>'+l.name+'</td><td>'+formatMoney(l.amount)+'</td><td>'+(l.repay||'')+'</td><td>'+(l.term||'')+'期</td><td>'+statusHtml(l.status)+'</td>'+
        '<td>'+(canWriteLoans()?'<button class="btn btn-sm btn-primary" onclick="editLoan(\''+l.id+'\')">去修正</button>':'')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += '<div class="card" style="background:'+(groupB.length?'#fff3e0':'#e8f5e9')+'"><div class="card-header"><div class="card-title">'+(groupB.length?'🟡':'✅')+' 实收利息跟公式对不上的合同（共 '+groupB.length+' 笔）</div></div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">这些合同已经有实际收到的利息记录，但跟"还款方式"公式现算出来的利息差距较大——很可能是当初选的还款方式（先息后本/等额本息/永续贷）套错了，客户实际是不规律还款，建议改成"自定义还款"，把真实的每期本金/利息填进去。</div>';
  if(groupB.length===0) { h += '<div style="text-align:center;padding:16px;color:var(--muted)">没有发现明显对不上的合同 🎉</div>'; }
  else {
    groupB.forEach(function(x){
      var l = x.loan;
      h += '<div style="border:1px solid #ffe0b2;border-radius:8px;padding:12px 14px;margin-bottom:10px">';
      h += '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px"><div><b>'+l.id+' · '+l.name+'</b> <span style="font-size:12px;color:var(--muted)">（当前还款方式：'+(l.repay||'')+'）</span></div>'+
        (canWriteLoans()?'<button class="btn btn-sm btn-primary" onclick="editLoan(\''+l.id+'\')">去修正</button>':'')+'</div>';
      h += '<div style="font-size:12px;color:#e65100;margin-bottom:4px">'+x.reasons.join('；')+'</div>';
      h += '<div style="font-size:12px;color:var(--muted)">实收利息记录：'+x.amounts.map(function(v){return '$'+v.toFixed(2);}).join(' , ')+' &nbsp;|&nbsp; 公式算出的各期利息：'+x.formulaInts.map(function(v){return '$'+v.toFixed(2);}).join(' , ')+'</div>';
      h += '</div>';
    });
  }
  h += '</div>';

  h += '<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px">💡 这个检查只能发现"数据看起来不对劲"的合同，不能100%确定一定有问题，建议对着纸质合同再核实一遍。</div>';

  document.getElementById("mainContent").innerHTML = h;
}
